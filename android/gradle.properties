# Xmx8G (valeur par défaut du template Flutter) demandait plus de RAM que
# cette machine n'en a physiquement au total (7,88 Go) — cause directe du
# crash du daemon Gradle ("Gradle build daemon disappeared unexpectedly").
# 1536m est largement suffisant pour un projet de cette taille.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Kotlin intégré d'AGP 9 : DOIT rester à `false` avec Flutter 3.44.
#
# Le plugin Gradle de Flutter 3.44 applique lui-même `kotlin-android` à
# chaque plugin qui ne le déclare pas (FlutterPluginUtils
# .detectApplyingKotlinGradlePlugin, sans condition). Avec `true`, AGP 9
# refuse ce KGP (« The 'org.jetbrains.kotlin.android' plugin is no longer
# required… ») et le build casse dès connectivity_plus — essayé le
# 2026-09-11. Repasser à `true` seulement quand une version de Flutter aura
# retiré cette application automatique.
#
# L'avertissement « plugins that apply KGP » ne vise que les plugins qui
# l'appliquent EUX-MÊMES. speech_to_text 7.5 n'en fait plus partie ;
# package_info_plus 8.x et pdfx 2.11 restent signalés : leurs versions sans
# KGP (10.2, et le mode sans KGP de pdfx) exigent `true`, impossible ici —
# voir le commentaire de package_info_plus dans pubspec.yaml.
android.builtInKotlin=false

# ── Build sur une machine a memoire serree ────────────────────────────────
#
# Meme a 1536m de tas, le daemon disparaissait ("Gradle build daemon
# disappeared unexpectedly") : la machine n'avait plus qu'un peu plus d'1 Go
# libre, et un build Android lance normalement TROIS JVM — Gradle, Kotlin et
# l'outil de dexation — qui se les disputent.
#
# On n'en garde qu'une seule, et un seul worker. Le build est plus lent, il
# aboutit.
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
