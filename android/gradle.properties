# Xmx8G (valeur par défaut du template Flutter) demandait plus de RAM que
# cette machine n'en a physiquement au total (7,88 Go) — cause directe du
# crash du daemon Gradle ("Gradle build daemon disappeared unexpectedly").
# 1536m est largement suffisant pour un projet de cette taille.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ── Build sur une machine a memoire serree ────────────────────────────────
#
# Meme a 1536m de tas, le daemon disparaissait ("Gradle build daemon
# disappeared unexpectedly") : la machine n'avait plus qu'un peu plus d'1 Go
# libre, et un build Android lance normalement TROIS JVM — Gradle, Kotlin et
# l'outil de dexation — qui se les disputent.
#
# On n'en garde qu'une seule, et un seul worker. Le build est plus lent, il
# aboutit.
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
