# Xmx8G (valeur par défaut du template Flutter) demandait plus de RAM que
# cette machine n'en a physiquement au total (7,88 Go) — cause directe du
# crash du daemon Gradle ("Gradle build daemon disappeared unexpectedly").
# 1536m est largement suffisant pour un projet de cette taille.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
